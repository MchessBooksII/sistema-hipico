<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hípico PRO - Élite</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; padding: 15px; }
        h1 { color: #00e676; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Controles */
        .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 10px; border: 1px solid #333; }
        input, select { padding: 8px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 14px; }
        button { padding: 9px 15px; background: #00e676; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #00c853; transform: scale(1.05); }
        .btn-blue { background: #29b6f6; color: #000; }
        .btn-blue:hover { background: #039be5; }
        .btn-red { background: #ef5350; color: #fff; }
        .btn-red:hover { background: #d32f2f; }
        .btn-orange { background: #ffa726; color: #000; }
        .btn-orange:hover { background: #fb8c00; }
        
        /* Tabla */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; font-size: 13px; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid #333; }
        th { background: #2c2c2c; color: #00e676; position: sticky; top: 0; font-weight: 600; }
        td input { width: 100%; box-sizing: border-box; text-align: center; background: #2a2a2a; border: 1px solid #444; }
        
        /* Colores de Ranking */
        .rankin-1 { background-color: rgba(0, 230, 118, 0.2); font-weight: bold; color: #00e676; font-size: 15px;}
        .rankin-2 { background-color: rgba(255, 167, 38, 0.2); font-weight: bold; color: #ffa726; }
        .rankin-3 { background-color: rgba(255, 112, 67, 0.2); font-weight: bold; color: #ff7043; }
        
        /* Alertas */
        .valor { color: #d500f9; font-weight: bold; text-shadow: 0 0 5px #d500f9; }
        .trampa { color: #ef5350; font-weight: bold; }
        .sin-datos { color: #757575; font-style: italic; }
    </style>
</head>
<body>

    <h1>🏇 Sistema Hípico PRO - Élite</h1>

    <div class="controls">
        <input type="text" id="hipodromo" list="hipodromos" placeholder="Hipódromo" style="width: 140px;">
        <datalist id="hipodromos">
            <option value="La Rinconada"><option value="Keeneland"><option value="Charles Town"><option value="Gulfstream"><option value="Santa Anita">
        </datalist>

        <input type="number" id="carrera" placeholder="Carrera N°" style="width: 90px;">
        <input type="number" id="distancia" placeholder="Distancia (mts)" style="width: 110px;">
        <button onclick="agregarCaballo()">➕ Agregar Caballo</button>
        <button onclick="calcularTodo()" class="btn-blue">🧮 Calcular Todo</button>
        
        <select id="filtroHipodromo" onchange="renderTabla()" style="margin-left: 10px;">
            <option value="TODOS">Ver Todos</option>
        </select>

        <button onclick="exportarDatos()" class="btn-orange">💾 Respaldar</button>
        <input type="file" id="importarArchivo" style="display: none;" accept=".json" onchange="importarDatos(event)">
        <button onclick="document.getElementById('importarArchivo').click()" class="btn-orange">📂 Cargar</button>
        <button onclick="exportarCSV()" class="btn-blue">📊 Exportar a Excel</button>
        <button onclick="limpiarTodo()" class="btn-red">🗑️ Limpiar</button>
    </div>

    <div class="table-container">
        <table id="tablaCaballos">
            <thead>
                <tr>
                    <th>Hipódromo</th><th>Carr.</th><th>Nro</th>
                    <th>T1</th><th>T2</th><th>T3</th><th>T4</th><th>T5</th>
                    <th>D1</th><th>D2</th><th>D3</th><th>D4</th><th>D5</th>
                    <th>Puesto</th><th>Kilos</th>
                    <th>Style</th><th>Quirin</th><th>Morning Line</th>
                    <th>TP Real</th><th>Ajuste</th><th>TP Ajust.</th>
                    <th>Ranking</th><th>Dif</th><th>Est</th><th>Alerta</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <script>
        let caballos = JSON.parse(localStorage.getItem('caballosHipicosElite')) || [];

        // Convertir formato 1:10.4 a 70.4 segundos
        function parseTiempo(valor) {
            if (!valor) return NaN;
            valor = valor.toString().trim();
            if (valor.includes(':')) {
                const partes = valor.split(':');
                return (parseFloat(partes[0]) * 60) + parseFloat(partes[1]);
            }
            return parseFloat(valor);
        }

        function guardar() {
            localStorage.setItem('caballosHipicosElite', JSON.stringify(caballos));
            renderTabla();
            actualizarFiltro();
        }

        function agregarCaballo() {
            const hipodromo = document.getElementById('hipodromo').value.trim();
            const carrera = document.getElementById('carrera').value;
            const distancia = document.getElementById('distancia').value;
            
            if(!hipodromo || !carrera || !distancia) { alert("Llena Hipódromo, Carrera y Distancia."); return; }

            caballos.push({
                id: Date.now(), hipodromo, carrera: parseInt(carrera), distanciaHoy: parseInt(distancia),
                nro: '', t1: '', t2: '', t3: '', t4: '', t5: '',
                d1: '', d2: '', d3: '', d4: '', d5: '',
                puesto: '', kilos: '', style: '', quirin: '', ml: '',
                tpReal: '', ajuste: '', tpAjustado: '', ranking: '', dif: '', est: '', alerta: ''
            });
            guardar();
        }

        function actualizarDato(id, campo, valor) {
            const caballo = caballos.find(c => c.id === id);
            if(caballo) { caballo[campo] = valor; guardar(); }
        }

        function actualizarFiltro() {
            const select = document.getElementById('filtroHipodromo');
            const valorActual = select.value;
            const hipodromos = [...new Set(caballos.map(c => c.hipodromo))];
            
            select.innerHTML = '<option value="TODOS">Ver Todos</option>';
            hipodromos.forEach(h => select.innerHTML += `<option value="${h}">${h}</option>`);
            if (hipodromos.includes(valorActual) || valorActual === "TODOS") select.value = valorActual;
        }

        function renderTabla() {
            const tbody = document.getElementById('cuerpoTabla');
            const filtro = document.getElementById('filtroHipodromo').value;
            tbody.innerHTML = '';
            
            const caballosFiltrados = filtro === "TODOS" ? caballos : caballos.filter(c => c.hipodromo === filtro);

            caballosFiltrados.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${c.hipodromo}</b></td>
                    <td>${c.carrera}</td>
                    <td><input type="number" value="${c.nro}" onchange="actualizarDato(${c.id}, 'nro', this.value)"></td>
                    <td><input type="text" value="${c.t1}" onchange="actualizarDato(${c.id}, 't1', this.value)"></td>
                    <td><input type="text" value="${c.t2}" onchange="actualizarDato(${c.id}, 't2', this.value)"></td>
                    <td><input type="text" value="${c.t3}" onchange="actualizarDato(${c.id}, 't3', this.value)"></td>
                    <td><input type="text" value="${c.t4}" onchange="actualizarDato(${c.id}, 't4', this.value)"></td>
                    <td><input type="text" value="${c.t5}" onchange="actualizarDato(${c.id}, 't5', this.value)"></td>
                    <td><input type="number" value="${c.d1}" onchange="actualizarDato(${c.id}, 'd1', this.value)"></td>
                    <td><input type="number" value="${c.d2}" onchange="actualizarDato(${c.id}, 'd2', this.value)"></td>
                    <td><input type="number" value="${c.d3}" onchange="actualizarDato(${c.id}, 'd3', this.value)"></td>
                    <td><input type="number" value="${c.d4}" onchange="actualizarDato(${c.id}, 'd4', this.value)"></td>
                    <td><input type="number" value="${c.d5}" onchange="actualizarDato(${c.id}, 'd5', this.value)"></td>
                    <td><input type="number" value="${c.puesto}" onchange="actualizarDato(${c.id}, 'puesto', this.value)"></td>
                    <td><input type="number" value="${c.kilos}" onchange="actualizarDato(${c.id}, 'kilos', this.value)"></td>
                    <td><select onchange="actualizarDato(${c.id}, 'style', this.value)">
                        <option value=""></option><option value="E" ${c.style==='E'?'selected':''}>E</option>
                        <option value="P" ${c.style==='P'?'selected':''}>P</option><option value="S" ${c.style==='S'?'selected':''}>S</option>
                        <option value="E/P" ${c.style==='E/P'?'selected':''}>E/P</option>
                    </select></td>
                    <td><input type="number" value="${c.quirin}" onchange="actualizarDato(${c.id}, 'quirin', this.value)" min="0" max="8"></td>
                    <td><input type="number" step="0.1" value="${c.ml}" onchange="actualizarDato(${c.id}, 'ml', this.value)"></td>
                    <td>${c.tpReal}</td>
                    <td>${c.ajuste}</td>
                    <td><b>${c.tpAjustado}</b></td>
                    <td class="${c.ranking === 1 ? 'rankin-1' : c.ranking === 2 ? 'rankin-2' : c.ranking === 3 ? 'rankin-3' : ''}">${c.ranking}</td>
                    <td>${c.dif}</td>
                    <td>${c.est}</td>
                    <td class="${c.alerta === 'VALOR' ? 'valor' : c.alerta === 'TRAMPA' ? 'trampa' : ''}">${c.alerta}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function calcularTodo() {
            if(caballos.length === 0) return;

            caballos.forEach(c => {
                const tiempos = [parseTiempo(c.t1), parseTiempo(c.t2), parseTiempo(c.t3), parseTiempo(c.t4), parseTiempo(c.t5)];
                const distancias = [parseFloat(c.d1), parseFloat(c.d2), parseFloat(c.d3), parseFloat(c.d4), parseFloat(c.d5)];
                
                let tiemposValidos = [];
                for(let i=0; i<5; i++) {
                    if(distancias[i] === c.distanciaHoy && !isNaN(tiempos[i])) tiemposValidos.push(tiempos[i]);
                }

                c.tpReal = tiemposValidos.length > 0 ? (tiemposValidos.reduce((a,b) => a+b, 0) / tiemposValidos.length).toFixed(2) : "Sin Datos";

                // Ajuste
                let ajuste = 0;
                const kilos = parseFloat(c.kilos);
                const puesto = parseFloat(c.puesto);
                if(!isNaN(kilos) && kilos > 0) ajuste += (kilos - 54) * 0.2;
                if(!isNaN(puesto) && puesto > 0) {
                    if(puesto <= 3) ajuste -= 0.2;
                    else if(puesto >= 8) ajuste += 0.3;
                }
                c.ajuste = ajuste.toFixed(2);
                c.tpAjustado = c.tpReal !== "Sin Datos" ? (parseFloat(c.tpReal) + ajuste).toFixed(2) : "Sin Datos";
                c.alerta = ""; 
            });

            const carrerasUnicas = [...new Set(caballos.map(c => `${c.hipodromo} - C${c.carrera}`))];
            
            carrerasUnicas.forEach(clave => {
                let lista = caballos.filter(c => `${c.hipodromo} - C${c.carrera}` === clave && c.tpAjustado !== "Sin Datos");
                if(lista.length === 0) return;

                lista.sort((a,b) => parseFloat(a.tpAjustado) - parseFloat(b.tpAjustado));
                const mejorTiempo = parseFloat(lista[0].tpAjustado);

                lista.forEach((c, index) => {
                    c.ranking = index + 1;
                    c.dif = (parseFloat(c.tpAjustado) - mejorTiempo).toFixed(2);
                    c.est = c.dif <= 0.3 ? "***" : c.dif <= 0.8 ? "**" : "*";
                    
                    // Lógica de VALOR y TRAMPA
                    const ml = parseFloat(c.ml);
                    if (!isNaN(ml)) {
                        if (c.ranking === 1 && ml >= 4.0) c.alerta = "VALOR";
                        else if (c.ranking >= 4 && ml <= 2.5) c.alerta = "TRAMPA";
                    }
                });
            });

            caballos.forEach(c => {
                if(c.tpAjustado === "Sin Datos") { c.ranking = "-"; c.dif = "-"; c.est = "-"; }
            });
            guardar();
        }

        // RESPALDO
        function exportarDatos() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(caballos));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "respaldo_hipico_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(a); a.click(); a.remove();
        }

        function importarDatos(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const contenido = JSON.parse(e.target.result);
                    if(Array.isArray(contenido)) { caballos = contenido; guardar(); alert("¡Datos cargados!"); }
                } catch (error) { alert("Error al leer el archivo."); }
            };
            reader.readAsText(event.target.files[0]);
        }

        function limpiarTodo() {
            if(confirm("¿Borrar todos los datos actuales?")) { caballos = []; guardar(); }
        }

        // EXPORTAR A CSV (Para abrir en Excel)
        function exportarCSV() {
            if(caballos.length === 0) return alert("No hay datos para exportar.");
            
            const cabeceras = ["Hipodromo", "Carrera", "Nro", "TP Real", "Ajuste", "TP Ajustado", "Ranking", "Dif", "Est", "Alerta", "Style", "Quirin", "MorningLine"];
            const filas = caballos.map(c => [c.hipodromo, c.carrera, c.nro, c.tpReal, c.ajuste, c.tpAjustado, c.ranking, c.dif, c.est, c.alerta, c.style, c.quirin, c.ml].join(","));
            
            const csvContent = "data:text/csv;charset=utf-8," + cabeceras.join(",") + "\n" + filas.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "resultados_hipicos.csv");
            document.body.appendChild(link); link.click(); link.remove();
        }

        actualizarFiltro();
        renderTabla();
    </script>
</body>
</html>
