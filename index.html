<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hípico PRO | Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a; --panel-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --border: #334155; --valor: #c084fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); padding: 20px; font-size: 14px;
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .panel { background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .group-inputs { display: flex; gap: 10px; flex: 1; }

        input, select { background-color: #0f172a; border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; border-radius: 6px; font-size: 13px; outline: none; transition: border-color 0.2s; width: 100%; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }

        button { padding: 10px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .btn-primary { background: var(--accent); color: white; } .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: white; } .btn-success:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); } .btn-danger:hover { background: var(--danger); color: white; }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); } .btn-outline:hover { background: var(--border); }

        .table-wrapper { background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 70vh; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; white-space: nowrap; }
        th { background-color: #1e293b; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; padding: 12px 10px; text-align: center; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; }
        td { padding: 0; text-align: center; border-bottom: 1px solid var(--border); transition: background-color 0.2s; height: 40px; }
        tr:hover td { background-color: rgba(59, 130, 246, 0.05); }

        th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; z-index: 5; background-color: var(--panel-bg); }
        th:nth-child(2), td:nth-child(2) { position: sticky; left: 100px; z-index: 5; background-color: var(--panel-bg); }
        th:nth-child(3), td:nth-child(3) { position: sticky; left: 150px; z-index: 5; background-color: var(--panel-bg); border-right: 1px solid var(--border); }
        tr:hover td:nth-child(1), tr:hover td:nth-child(2), tr:hover td:nth-child(3) { background-color: #26334d; }

        td input, td select { background: transparent; border: 1px solid transparent; border-radius: 0; padding: 10px 6px; color: var(--text-main); width: 100%; height: 100%; text-align: center; font-family: inherit; font-size: 14px;}
        td input:hover, td select:hover { border-color: var(--border); background: #0f172a; }
        td input:focus, td select:focus { border-color: var(--accent); background: #0f172a; box-shadow: inset 0 0 0 1px var(--accent); z-index: 6; position: relative;}

        .val-rankin-1 { color: var(--success); font-weight: bold; font-size: 16px; }
        .val-rankin-2 { color: var(--warning); font-weight: bold; font-size: 15px; }
        .val-rankin-3 { color: #f97316; font-weight: bold; }
        
        .val-alerta { display: inline-block; padding: 4px 10px; border-radius: 12px; font-weight: 700; font-size: 11px; letter-spacing: 0.5px; margin: 5px; }
        .alerta-valor { background-color: rgba(192, 132, 252, 0.2); color: var(--valor); border: 1px solid var(--valor); box-shadow: 0 0 8px rgba(192, 132, 252, 0.4); }
        .alerta-trampa { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        .text-sindatos { color: var(--text-muted); font-style: italic; font-size: 12px; }
        .text-destacado { font-weight: 700; color: white; padding: 5px;}
        .input-nro { font-weight: 700 !important; color: #f8fafc !important; }
        
        @keyframes highlight { from { background-color: rgba(59, 130, 246, 0.4); } to { background-color: transparent; } }
        .new-row { animation: highlight 1s ease-out; }
    </style>
</head>
<body>

    <header>
        <h1>🏇 SISTEMA HÍPICO PRO</h1>
        <div style="color: var(--text-muted); font-size: 12px;">v2.3 - Dashboard Analítico</div>
    </header>

    <div class="panel">
        <div class="group-inputs">
            <input type="text" id="hipodromo" list="hipodromos" placeholder="Hipódromo" style="width: 150px;">
            <datalist id="hipodromos">
                <option value="La Rinconada"><option value="Keeneland"><option value="Charles Town"><option value="Gulfstream"><option value="Santa Anita">
            </datalist>
            <input type="number" id="carrera" placeholder="Carrera N°" style="width: 110px;">
            <input type="number" id="distancia" placeholder="Distancia (mts)" style="width: 130px;">
            <button onclick="agregarCaballo(true)" class="btn-primary" style="width: auto;">➕ Añadir Ejemplar</button>
        </div>
        
        <select id="filtroHipodromo" onchange="renderTabla()" style="width: 180px; background: #0f172a;">
            <option value="TODOS">🌐 Ver Todos los Hipódromos</option>
        </select>
    </div>

    <div class="panel" style="justify-content: space-between;">
        <div style="display: flex; gap: 10px;">
            <button onclick="calcularTodo()" class="btn-success">🧮 Ejecutar Cálculos Mágicos</button>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="exportarCSV()" class="btn-outline">📊 Exportar a Excel</button>
            <button onclick="exportarDatos()" class="btn-outline">💾 Respaldo</button>
            <input type="file" id="importarArchivo" style="display: none;" accept=".json" onchange="importarDatos(event)">
            <button onclick="document.getElementById('importarArchivo').click()" class="btn-outline">📂 Restaurar</button>
            <button onclick="limpiarTodo()" class="btn-danger">🗑️</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Hipódromo</th>
                    <th style="width: 50px;">Carr.</th>
                    <th style="width: 50px;">Nro</th>
                    <th>T1</th><th>T2</th><th>T3</th><th>T4</th><th>T5</th>
                    <th>D1</th><th>D2</th><th>D3</th><th>D4</th><th>D5</th>
                    <th>Puesto</th><th>Kilos</th>
                    <th>Style</th><th>Quir.</th><th>M. Line</th>
                    <th style="color: #60a5fa;">TP Real</th><th>Ajuste</th>
                    <th style="color: #c084fc;">TP Ajust.</th>
                    <th>Ranking</th><th>Dif</th><th>Est</th>
                    <th style="color: var(--success);">Alerta</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <script>
        let caballos = JSON.parse(localStorage.getItem('caballosHipicosElite')) || [];

        function parseTiempo(valor) {
            if (!valor) return NaN;
            valor = valor.toString().trim();
            if (valor.includes(':')) {
                const partes = valor.split(':');
                return (parseFloat(partes[0]) * 60) + parseFloat(partes[1]);
            }
            return parseFloat(valor);
        }

        // Función para convertir fracciones (8/5) o decimales (2.5) a Cuota Decimal
        function parseOdds(valor) {
            if (!valor) return NaN;
            valor = valor.toString().trim();
            
            // Si tiene barra (8/5) o guion (8-5)
            if (valor.includes('/') || valor.includes('-')) {
                const partes = valor.split(/[\/\-]/);
                if (partes.length === 2) {
                    const num = parseFloat(partes[0]);
                    const den = parseFloat(partes[1]);
                    if (!isNaN(num) && !isNaN(den) && den !== 0) {
                        return (num / den) + 1; // Ej: 8/5 = 1.6 + 1 = 2.60
                    }
                }
            }
            // Si ya es un número decimal directo
            return parseFloat(valor);
        }

        function guardarSilencioso() {
            localStorage.setItem('caballosHipicosElite', JSON.stringify(caballos));
        }

        function actualizarDato(id, campo, valor) {
            const caballo = caballos.find(c => c.id === id);
            if(caballo) { 
                caballo[campo] = valor; 
                guardarSilencioso(); 
            }
        }

        function agregarCaballo(focusAuto = false) {
            const hipodromo = document.getElementById('hipodromo').value.trim();
            const carrera = document.getElementById('carrera').value;
            const distancia = document.getElementById('distancia').value;
            
            if(!hipodromo || !carrera || !distancia) {
                if (caballos.length === 0) {
                    alert("Por favor llena Hipódromo, Carrera y Distancia primero.");
                    return;
                }
            }

            const hFinal = hipodromo || caballos[caballos.length-1].hipodromo;
            const cFinal = parseInt(carrera) || caballos[caballos.length-1].carrera;
            const dFinal = parseInt(distancia) || caballos[caballos.length-1].distanciaHoy;

            caballos.push({
                id: Date.now(), hipodromo: hFinal, carrera: cFinal, distanciaHoy: dFinal,
                nro: '', t1: '', t2: '', t3: '', t4: '', t5: '',
                d1: '', d2: '', d3: '', d4: '', d5: '',
                puesto: '', kilos: '', style: '', quirin: '', ml: '',
                tpReal: '', ajuste: '', tpAjustado: '', ranking: '', dif: '', est: '', alerta: ''
            });
            
            guardarSilencioso();
            renderTabla(true); 

            if (focusAuto) {
                setTimeout(() => {
                    const rows = document.querySelectorAll('#cuerpoTabla tr');
                    if (rows.length > 0) {
                        const lastRow = rows[rows.length - 1];
                        const firstInput = lastRow.querySelector('input');
                        if (firstInput) {
                            firstInput.focus();
                            firstInput.select(); 
                        }
                    }
                }, 50);
            }
        }

        function actualizarFiltro() {
            const select = document.getElementById('filtroHipodromo');
            const valorActual = select.value;
            const hipodromos = [...new Set(caballos.map(c => c.hipodromo))];
            
            select.innerHTML = '<option value="TODOS">🌐 Ver Todos los Hipódromos</option>';
            hipodromos.forEach(h => select.innerHTML += `<option value="${h}">${h}</option>`);
            if (hipodromos.includes(valorActual) || valorActual === "TODOS") select.value = valorActual;
        }

        function handleKeyDown(e) {
            const inputs = Array.from(document.querySelectorAll('#cuerpoTabla input, #cuerpoTabla select'));
            const isLastInput = (e.target === inputs[inputs.length - 1]);

            if (e.key === 'Tab' && !e.shiftKey) {
                if (isLastInput) {
                    e.preventDefault(); 
                    agregarCaballo(true); 
                }
            } 
            else if (e.key === 'Enter') {
                e.preventDefault();
                if (isLastInput) {
                    agregarCaballo(true);
                } else {
                    const tr = e.target.closest('tr');
                    const nextTr = tr.nextElementSibling;
                    if (nextTr) {
                        const cellIndex = e.target.closest('td').cellIndex;
                        const nextInput = nextTr.cells[cellIndex].querySelector('input, select');
                        if (nextInput) nextInput.focus();
                    } else {
                        agregarCaballo(true);
                    }
                }
            }
        }

        function renderTabla(animarUltimaFila = false) {
            const tbody = document.getElementById('cuerpoTabla');
            const filtro = document.getElementById('filtroHipodromo').value;
            
            const activeElement = document.activeElement;
            const activeId = activeElement ? activeElement.getAttribute('data-id') : null;
            const activeField = activeElement ? activeElement.getAttribute('data-field') : null;

            tbody.innerHTML = '';
            actualizarFiltro();
            
            const caballosFiltrados = filtro === "TODOS" ? caballos : caballos.filter(c => c.hipodromo === filtro);
            const lastId = caballos.length > 0 ? caballos[caballos.length-1].id : null;

            caballosFiltrados.forEach(c => {
                const tr = document.createElement('tr');
                if (animarUltimaFila && c.id === lastId) {
                    tr.classList.add('new-row');
                }
                tr.innerHTML = `
                    <td><span style="font-weight: 600; color: #94a3b8;">${c.hipodromo}</span></td>
                    <td>${c.carrera}</td>
                    <td><input type="number" class="input-nro" data-id="${c.id}" data-field="nro" value="${c.nro}" onchange="actualizarDato(${c.id}, 'nro', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="text" data-id="${c.id}" data-field="t1" value="${c.t1}" onchange="actualizarDato(${c.id}, 't1', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="text" data-id="${c.id}" data-field="t2" value="${c.t2}" onchange="actualizarDato(${c.id}, 't2', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="text" data-id="${c.id}" data-field="t3" value="${c.t3}" onchange="actualizarDato(${c.id}, 't3', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="text" data-id="${c.id}" data-field="t4" value="${c.t4}" onchange="actualizarDato(${c.id}, 't4', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="text" data-id="${c.id}" data-field="t5" value="${c.t5}" onchange="actualizarDato(${c.id}, 't5', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="number" data-id="${c.id}" data-field="d1" value="${c.d1}" onchange="actualizarDato(${c.id}, 'd1', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="number" data-id="${c.id}" data-field="d2" value="${c.d2}" onchange="actualizarDato(${c.id}, 'd2', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="number" data-id="${c.id}" data-field="d3" value="${c.d3}" onchange="actualizarDato(${c.id}, 'd3', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="number" data-id="${c.id}" data-field="d4" value="${c.d4}" onchange="actualizarDato(${c.id}, 'd4', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="number" data-id="${c.id}" data-field="d5" value="${c.d5}" onchange="actualizarDato(${c.id}, 'd5', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="number" data-id="${c.id}" data-field="puesto" value="${c.puesto}" onchange="actualizarDato(${c.id}, 'puesto', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><input type="number" data-id="${c.id}" data-field="kilos" value="${c.kilos}" onchange="actualizarDato(${c.id}, 'kilos', this.value)" onkeydown="handleKeyDown(event)"></td>
                    <td><select data-id="${c.id}" data-field="style" onchange="actualizarDato(${c.id}, 'style', this.value)" onkeydown="handleKeyDown(event)">
                        <option value=""></option><option value="E" ${c.style==='E'?'selected':''}>E</option>
                        <option value="P" ${c.style==='P'?'selected':''}>P</option><option value="S" ${c.style==='S'?'selected':''}>S</option>
                        <option value="E/P" ${c.style==='E/P'?'selected':''}>E/P</option>
                    </select></td>
                    <td><input type="number" data-id="${c.id}" data-field="quirin" value="${c.quirin}" onchange="actualizarDato(${c.id}, 'quirin', this.value)" onkeydown="handleKeyDown(event)" min="0" max="8"></td>
                    
                    <!-- CAMBIO AQUÍ: type="text" para aceptar 8/5 -->
                    <td><input type="text" data-id="${c.id}" data-field="ml" value="${c.ml}" placeholder="Ej: 8/5" onchange="actualizarDato(${c.id}, 'ml', this.value)" onkeydown="handleKeyDown(event)"></td>
                    
                    <td class="${c.tpReal === 'Sin Datos' ? 'text-sindatos' : 'text-destacado'}">${c.tpReal}</td>
                    <td class="${c.ajuste > 0 ? 'alerta-trampa' : ''}" style="${c.ajuste < 0 ? 'color: var(--success)' : ''}">${c.ajuste}</td>
                    <td class="${c.tpAjustado === 'Sin Datos' ? 'text-sindatos' : 'text-destacado'}" style="color: #c084fc;">${c.tpAjustado}</td>
                    
                    <td class="${c.ranking === 1 ? 'val-rankin-1' : c.ranking === 2 ? 'val-rankin-2' : c.ranking === 3 ? 'val-rankin-3' : ''}">${c.ranking}</td>
                    <td>${c.dif}</td>
                    <td style="font-weight: 600;">${c.est}</td>
                    
                    <td>
                        ${c.alerta === 'VALOR' ? '<span class="val-alerta alerta-valor">🔥 VALOR</span>' : 
                          c.alerta === 'TRAMPA' ? '<span class="val-alerta alerta-trampa">❌ TRAMPA</span>' : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (activeId && activeField) {
                const inputToFocus = document.querySelector(`input[data-id="${activeId}"][data-field="${activeField}"], select[data-id="${activeId}"][data-field="${activeField}"]`);
                if (inputToFocus) {
                    inputToFocus.focus();
                }
            }
        }

        function calcularTodo() {
            if(caballos.length === 0) return;

            caballos.forEach(c => {
                const tiempos = [parseTiempo(c.t1), parseTiempo(c.t2), parseTiempo(c.t3), parseTiempo(c.t4), parseTiempo(c.t5)];
                const distancias = [parseFloat(c.d1), parseFloat(c.d2), parseFloat(c.d3), parseFloat(c.d4), parseFloat(c.d5)];
                
                let tiemposValidos = [];
                for(let i=0; i<5; i++) {
                    if(distancias[i] === c.distanciaHoy && !isNaN(tiempos[i])) tiemposValidos.push(tiempos[i]);
                }

                c.tpReal = tiemposValidos.length > 0 ? (tiemposValidos.reduce((a,b) => a+b, 0) / tiemposValidos.length).toFixed(2) : "Sin Datos";

                let ajuste = 0;
                const kilos = parseFloat(c.kilos);
                const puesto = parseFloat(c.puesto);
                if(!isNaN(kilos) && kilos > 0) ajuste += (kilos - 54) * 0.2;
                if(!isNaN(puesto) && puesto > 0) {
                    if(puesto <= 3) ajuste -= 0.2;
                    else if(puesto >= 8) ajuste += 0.3;
                }
                c.ajuste = ajuste.toFixed(2);
                c.tpAjustado = c.tpReal !== "Sin Datos" ? (parseFloat(c.tpReal) + ajuste).toFixed(2) : "Sin Datos";
                c.alerta = ""; 
            });

            const carrerasUnicas = [...new Set(caballos.map(c => `${c.hipodromo} - C${c.carrera}`))];
            
            carrerasUnicas.forEach(clave => {
                let lista = caballos.filter(c => `${c.hipodromo} - C${c.carrera}` === clave && c.tpAjustado !== "Sin Datos");
                if(lista.length === 0) return;

                lista.sort((a,b) => parseFloat(a.tpAjustado) - parseFloat(b.tpAjustado));
                const mejorTiempo = parseFloat(lista[0].tpAjustado);

                lista.forEach((c, index) => {
                    c.ranking = index + 1;
                    c.dif = (parseFloat(c.tpAjustado) - mejorTiempo).toFixed(2);
                    c.est = c.dif <= 0.3 ? "***" : c.dif <= 0.8 ? "**" : "*";
                    
                    // Conversión de Morning Line a decimal para la alerta
                    const mlDecimal = parseOdds(c.ml);
                    if (!isNaN(mlDecimal)) {
                        if (c.ranking === 1 && mlDecimal >= 4.0) c.alerta = "VALOR";
                        else if (c.ranking >= 4 && mlDecimal <= 2.5) c.alerta = "TRAMPA";
                    }
                });
            });

            caballos.forEach(c => {
                if(c.tpAjustado === "Sin Datos") { c.ranking = "-"; c.dif = "-"; c.est = "-"; }
            });
            
            guardarSilencioso();
            renderTabla(); 
            alert("¡Cálculos ejecutados con éxito! Revisa el Ranking y Alertas.");
        }

        function exportarDatos() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(caballos));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "respaldo_hipico_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(a); a.click(); a.remove();
        }

        function importarDatos(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const contenido = JSON.parse(e.target.result);
                    if(Array.isArray(contenido)) { caballos = contenido; guardarSilencioso(); renderTabla(); alert("¡Datos cargados exitosamente!"); }
                } catch (error) { alert("Error al leer el archivo."); }
            };
            reader.readAsText(event.target.files[0]);
        }

        function limpiarTodo() {
            if(confirm("¿Borrar todos los datos actuales? Asegúrate de tener un respaldo.")) { caballos = []; guardarSilencioso(); renderTabla(); }
        }

        function exportarCSV() {
            if(caballos.length === 0) return alert("No hay datos para exportar.");
            const cabeceras = ["Hipodromo", "Carrera", "Nro", "TP Real", "Ajuste", "TP Ajustado", "Ranking", "Dif", "Est", "Alerta", "Style", "Quirin", "MorningLine"];
            const filas = caballos.map(c => [c.hipodromo, c.carrera, c.nro, c.tpReal, c.ajuste, c.tpAjustado, c.ranking, c.dif, c.est, c.alerta, c.style, c.quirin, c.ml].join(","));
            const csvContent = "data:text/csv;charset=utf-8," + cabeceras.join(",") + "\n" + filas.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri); link.setAttribute("download", "resultados_hipicos.csv");
            document.body.appendChild(link); link.click(); link.remove();
        }

        actualizarFiltro();
        renderTabla();
    </script>
</body>
</html>
